name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Inject API Key from Secrets
        env:
          TFKEY: ${{ secrets.TFKEY }}
        run: |
          if [ -z "$TFKEY" ]; then
            echo "Error: TFKEY secret is empty! Please add it to your repository secrets."
            exit 1
          fi
          # Replaces the placeholder in the code with the actual secret
          # Using | as delimiter in case the key contains /
          sed -i "s|YOUR_TINYFISH_API_KEY_HERE|$TFKEY|g" index.html
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

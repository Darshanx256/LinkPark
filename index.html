<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <title>LinkPark — Music Link Resolver</title>
  <link rel="preconnect" href="https://api.song.link">
  <link rel="preconnect" href="https://api.search.tinyfish.ai">
  <link rel="preconnect" href="https://itunes.apple.com">
  <script src="config.js" onerror="console.log('No local config.js found')"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #18181f;
      --border: #ffffff12;
      --border2: #ffffff1e;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --accent: #7c6aff;
      --error: #ff5f5f;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem 4rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header img {
      width: 200px;
      margin: 0 auto;
      display: block;
    }

    header p {
      margin-top: 0.5rem;
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .search-wrap {
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 0.85rem 1.1rem;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      appearance: none;
      -webkit-appearance: none;
    }

    .search-input::-webkit-search-cancel-button {
      display: none;
    }

    .search-input::placeholder {
      color: var(--muted);
      transition: opacity 0.5s ease;
    }

    .search-input.ph-fade::placeholder {
      opacity: 0;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #7c6aff28;
    }

    .dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 10px;
      overflow: hidden;
      z-index: 100;
      box-shadow: 0 16px 40px #00000060;
      display: none;
    }

    .dd-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 13px;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.1s, border-color 0.1s;
    }

    .dd-item:not(:last-child) {
      border-bottom: 1px solid var(--border);
    }

    .dd-item:hover,
    .dd-item.active {
      background: #7c6aff14;
      border-left-color: var(--accent);
    }

    .dd-item img {
      width: 38px;
      height: 38px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .dd-title {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dd-artist {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hint {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.65rem;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .hint.on {
      opacity: 1;
    }

    .loader {
      display: none;
      text-align: center;
      margin-top: 2.5rem;
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .loader span {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      margin: 0 3px;
      animation: bounce 0.9s ease-in-out infinite;
    }

    .loader span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .loader span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: translateY(0);
        opacity: .4
      }

      40% {
        transform: translateY(-6px);
        opacity: 1
      }
    }

    .error {
      display: none;
      margin-top: 1.5rem;
      padding: 11px 14px;
      background: #ff5f5f12;
      border: 1px solid #ff5f5f30;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--error);
      text-align: center;
    }

    .card {
      display: none;
      margin-top: 1.8rem;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 14px;
      overflow: hidden;
      animation: fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.1rem;
      border-bottom: 1px solid var(--border);
    }

    .card-art {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 4px 14px #00000050;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-artist {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .player-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .play-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s, background 0.15s;
    }

    .play-btn:hover {
      transform: scale(1.05);
      background: #8e7dff;
    }

    .play-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      margin-left: 2px;
    }

    .play-btn.playing svg {
      margin-left: 0;
    }

    .seek-wrap {
      flex: 1;
      height: 16px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .seek-bar {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .seek-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 0%;
      background: var(--accent);
      pointer-events: none;
      transition: width 0.1s linear;
    }

    .time-label {
      font-size: 0.7rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      min-width: 26px;
      text-align: right;
    }

    @media (max-width: 480px) {
      body {
        padding: 1.5rem 1rem 2rem;
      }

      header img {
        width: 170px;
      }

      .card-meta {
        padding: 0.85rem;
        gap: 0.85rem;
      }

      .card-art {
        width: 64px;
        height: 64px;
      }

      .play-btn {
        width: 26px;
        height: 26px;
      }

      .play-btn svg {
        width: 12px;
        height: 12px;
      }
    }

    .links {
      display: flex;
      flex-direction: column;
    }

    .prow {
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }

    .prow:last-child {
      border-bottom: none;
    }

    .prow:hover {
      background: #ffffff05;
    }

    .plink {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0.78rem 1rem;
      text-decoration: none;
      color: var(--text);
      min-width: 0;
    }

    .picon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0;
    }

    .picon svg {
      width: 16px;
      height: 16px;
    }

    .pname {
      font-size: 0.88rem;
      font-weight: 600;
    }

    .pbadge {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      background: var(--accent);
      color: #fff;
      padding: 1px 6px;
      border-radius: 99px;
      margin-left: 6px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .pbadge.show {
      opacity: 1;
    }

    .copy-btn {
      flex-shrink: 0;
      padding: 0 1rem;
      height: 100%;
      background: none;
      border: none;
      border-left: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.72rem;
      font-family: inherit;
      letter-spacing: 0.04em;
      transition: color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .copy-btn:hover {
      color: var(--text);
      background: #ffffff08;
    }

    .copy-btn.copied {
      color: #4ade80;
    }

    .copy-btn svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    .share-card-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .share-card-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .share-card-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
    }

    .share-card-btn.copied {
      background: #4ade8020;
      color: #4ade80;
      border-color: #4ade8040;
    }

    .card-footer {
      padding: 1rem;
      display: flex;
      justify-content: center;
      border-top: 1px solid var(--border);
      background: #ffffff03;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <header>
      <img src="logo.webp" alt="LinkPark Logo">
      <p>Find any song on every platform</p>
    </header>

    <form class="search-wrap" id="searchForm">
      <input class="search-input" id="q" type="search" placeholder="Search a song…" autocomplete="off"
        spellcheck="false">
      <button type="submit" style="display:none"></button>
      <div class="dropdown" id="dd"></div>
    </form>

    <p class="hint" id="hint">↑ ↓ navigate &nbsp;·&nbsp; Enter select &nbsp;·&nbsp; Esc close</p>
    <div class="loader" id="loader"><span></span><span></span><span></span></div>
    <div class="error" id="err"></div>

    <div class="card" id="card">
      <div class="card-meta">
        <img class="card-art" id="art" src="" alt="">
        <div class="card-info">
          <div class="card-title" id="ctitle"></div>
          <div class="card-artist" id="cartist"></div>
          <div class="player-wrap" id="playerWrap" style="display:none">
            <button class="play-btn" id="playBtn" aria-label="Play preview">
              <svg viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z" />
              </svg>
            </button>
            <div class="seek-wrap" id="seekWrap">
              <div class="seek-bar">
                <div class="seek-fill" id="seekFill"></div>
              </div>
            </div>
            <div class="time-label" id="timeLabel">0:00</div>
          </div>
        </div>
      </div>
      <div class="links" id="links"></div>
      <div class="card-footer">
        <button id="shareCardBtn" class="share-card-btn" title="Share this card">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          Share Music Card
        </button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkPark</title>
  <link rel="preconnect" href="https://api.song.link">
  <link rel="preconnect" href="https://api.search.tinyfish.ai">
  <link rel="preconnect" href="https://itunes.apple.com">
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <!-- Load local config if exists (ignored in git) -->
  <script src="config.js" onerror="console.log('No local config.js found')"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #18181f;
      --border: #ffffff12;
      --border2: #ffffff1e;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --accent: #7c6aff;
      --error: #ff5f5f;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem 4rem;
    }

    /* Subtle background grain */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #fff 30%, #7c6aff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    header p {
      margin-top: 0.5rem;
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    /* Search */
    .search-wrap {
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 0.85rem 1.1rem;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      appearance: none;
      -webkit-appearance: none;
    }

    .search-input::-webkit-search-cancel-button {
      display: none;
    }

    .search-input::placeholder {
      color: var(--muted);
      transition: opacity 0.5s ease;
    }

    .search-input.ph-fade::placeholder {
      opacity: 0;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #7c6aff28;
    }

    /* Dropdown */
    .dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 10px;
      overflow: hidden;
      z-index: 100;
      box-shadow: 0 16px 40px #00000060;
      display: none;
    }

    .dd-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 13px;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.1s, border-color 0.1s;
    }

    .dd-item:not(:last-child) {
      border-bottom: 1px solid var(--border);
    }

    .dd-item:hover,
    .dd-item.active {
      background: #7c6aff14;
      border-left-color: var(--accent);
    }

    .dd-item img {
      width: 38px;
      height: 38px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .dd-title {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dd-artist {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Hint */
    .hint {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.65rem;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .hint.on {
      opacity: 1;
    }

    /* Loader */
    .loader {
      display: none;
      text-align: center;
      margin-top: 2.5rem;
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .loader span {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      margin: 0 3px;
      animation: bounce 0.9s ease-in-out infinite;
    }

    .loader span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .loader span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: translateY(0);
        opacity: .4
      }

      40% {
        transform: translateY(-6px);
        opacity: 1
      }
    }

    /* Error */
    .error {
      display: none;
      margin-top: 1.5rem;
      padding: 11px 14px;
      background: #ff5f5f12;
      border: 1px solid #ff5f5f30;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--error);
      text-align: center;
    }

    /* Result card */
    .card {
      display: none;
      margin-top: 1.8rem;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 14px;
      overflow: hidden;
      animation: fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.1rem;
      border-bottom: 1px solid var(--border);
    }

    .card-art {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 4px 14px #00000050;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-artist {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .player-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .play-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s, background 0.15s;
    }

    .play-btn:hover {
      transform: scale(1.05);
      background: #8e7dff;
    }

    .play-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      margin-left: 2px;
    }

    .play-btn.playing svg {
      margin-left: 0;
    }

    .seek-wrap {
      flex: 1;
      height: 16px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .seek-bar {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .seek-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 0%;
      background: var(--accent);
      pointer-events: none;
      transition: width 0.1s linear;
    }

    .time-label {
      font-size: 0.7rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      min-width: 26px;
      text-align: right;
    }

    @media (max-width: 480px) {
      body {
        padding: 1.5rem 1rem 2rem;
      }

      header h1 {
        font-size: 2.1rem;
      }

      .card-meta {
        padding: 0.85rem;
        gap: 0.85rem;
      }

      .card-art {
        width: 64px;
        height: 64px;
      }

      .play-btn {
        width: 26px;
        height: 26px;
      }

      .play-btn svg {
        width: 12px;
        height: 12px;
      }
    }

    .links {
      display: flex;
      flex-direction: column;
    }

    /* Platform row */
    .prow {
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }

    .prow:last-child {
      border-bottom: none;
    }

    .prow:hover {
      background: #ffffff05;
    }

    .plink {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0.78rem 1rem;
      text-decoration: none;
      color: var(--text);
      min-width: 0;
    }

    .picon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0;
      /* hide text, show svg */
    }

    .picon svg {
      width: 16px;
      height: 16px;
    }

    .pname {
      font-size: 0.88rem;
      font-weight: 600;
    }

    .pbadge {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      background: var(--accent);
      color: #fff;
      padding: 1px 6px;
      border-radius: 99px;
      margin-left: 6px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .pbadge.show {
      opacity: 1;
    }

    .copy-btn {
      flex-shrink: 0;
      padding: 0 1rem;
      height: 100%;
      background: none;
      border: none;
      border-left: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.72rem;
      font-family: inherit;
      letter-spacing: 0.04em;
      transition: color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .copy-btn:hover {
      color: var(--text);
      background: #ffffff08;
    }

    .copy-btn.copied {
      color: #4ade80;
    }

    .copy-btn svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <header>
      <h1>LinkPark</h1>
      <p>Find any song on every platform</p>
    </header>

    <div class="search-wrap">
      <input class="search-input" id="q" type="search" placeholder="Search a song…" autocomplete="off"
        spellcheck="false">
      <div class="dropdown" id="dd"></div>
    </div>

    <p class="hint" id="hint">↑ ↓ navigate &nbsp;·&nbsp; Enter select &nbsp;·&nbsp; Esc close</p>
    <div class="loader" id="loader"><span></span><span></span><span></span></div>
    <div class="error" id="err"></div>

    <div class="card" id="card">
      <div class="card-meta">
        <img class="card-art" id="art" src="" alt="">
        <div class="card-info">
          <div class="card-title" id="ctitle"></div>
          <div class="card-artist" id="cartist"></div>
          <div class="player-wrap" id="playerWrap" style="display:none">
            <button class="play-btn" id="playBtn" aria-label="Play preview">
              <svg viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z" />
              </svg>
            </button>
            <div class="seek-wrap" id="seekWrap">
              <div class="seek-bar">
                <div class="seek-fill" id="seekFill"></div>
              </div>
            </div>
            <div class="time-label" id="timeLabel">0:00</div>
          </div>
        </div>
      </div>
      <div class="links" id="links"></div>
    </div>

  </div>

      document.getElementById('timeLabel').textContent = formatTime(audio.currentTime);
    });
    document.getElementById('playBtn').addEventListener('click', () => {
      if (isPlaying) audio.pause(); else audio.play();
    });
    document.getElementById('seekWrap').addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const p = (e.clientX - rect.left) / rect.width;
      audio.currentTime = p * audio.duration;
    });
    function formatTime(s) {
      const min = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${min}:${sec.toString().padStart(2, '0')}`;
    }
    function updatePlayBtn() {
      const btn = document.getElementById('playBtn');
      if (!btn) return;
      if (isPlaying) {
        btn.classList.add('playing');
        btn.innerHTML = `<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
      } else {
        btn.classList.remove('playing');
        btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
      }
    }

    // ── Input → iTunes (debounced 280ms) ──────────────────────────────────────
    qEl.addEventListener('input', () => {
      clearTimeout(timer);
      const v = qEl.value.trim();
      closeDD(); errEl.style.display = 'none';
      if (v.length < 2) return;
      if (!/\s/.test(v) && /^(https?:\/\/)?([\w.-]+\.[a-z]{2,}\/.*|spotify:track:.*)/i.test(v)) {
        let url = v;
        if (!/^https?:\/\//i.test(url) && !url.startsWith('spotify:')) {
          url = 'https://' + url;
        }
        timer = setTimeout(() => resolve(url), 280);
        return;
      }
      timer = setTimeout(() => suggest(v), 280);
    });

    async function suggest(q) {
      try {
        const r = await fetch(`https://itunes.apple.com/search?term=${enc(q)}&entity=song&limit=6&country=${COUNTRY}&v=${Date.now()}`);
        const d = await r.json();
        renderDD(d.results || []);
      } catch (_) { }
    }

    // ── Dropdown render ────────────────────────────────────────────────────────
    function renderDD(tracks) {
      if (!tracks.length) { closeDD(); return; }
      items = tracks.map(t => ({
        appleUrl: t.trackViewUrl,
        title: t.trackName,
        artist: t.artistName,
        art: (t.artworkUrl100 || t.artworkUrl60).replace('100x100bb', '600x600bb'),
        thumb: t.artworkUrl60,
        previewUrl: t.previewUrl,
      }));
      ddEl.innerHTML = items.map((it, i) => `
    <div class="dd-item" data-i="${i}">
      <img src="${it.thumb}" loading="lazy" alt="">
      <div style="min-width:0">
        <div class="dd-title">${esc(it.title)}</div>
        <div class="dd-artist">${esc(it.artist)}</div>
      </div>
    </div>`).join('');
      ddEl.style.display = 'block'; hintEl.classList.add('on'); idx = -1;
      ddEl.querySelectorAll('.dd-item').forEach(el => {
        el.addEventListener('mousedown', e => e.preventDefault());
        el.addEventListener('click', () => pick(+el.dataset.i));
      });
    }

    // ── Keyboard nav ───────────────────────────────────────────────────────────
    qEl.addEventListener('keydown', e => {
      if (ddEl.style.display !== 'block') return;
      if (e.key === 'ArrowDown') { e.preventDefault(); idx = (idx + 1) % items.length; hl(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); idx = (idx - 1 + items.length) % items.length; hl(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (idx >= 0) pick(idx); }
      else if (e.key === 'Escape') { closeDD(); }
    });
    function hl() {
      ddEl.querySelectorAll('.dd-item').forEach((el, i) => el.classList.toggle('active', i === idx));
    }
    function closeDD() { ddEl.style.display = 'none'; hintEl.classList.remove('on'); idx = -1; }
    document.addEventListener('click', e => { if (!e.target.closest('.search-wrap')) closeDD(); });

    // ── Pick → resolve ─────────────────────────────────────────────────────────
    function pick(i) {
      const it = items[i]; if (!it) return;
      qEl.value = `${it.title} — ${it.artist}`;
      closeDD(); resolve(it);
    }

    // ── Main resolution ────────────────────────────────────────────────────────
    async function resolve(data) {
      setLoad(true); linksEl.innerHTML = '';

      try {
        let od, tf = {}, item = data;

        if (typeof data === 'string') {
          od = await fetchOdesli(data);
          const ent = od?.entitiesByUniqueId?.[od?.entityUniqueId] || {};
          item = {
            title: ent.title || 'Unknown',
            artist: ent.artistName || 'Unknown',
            art: ent.thumbnailUrl || '',
            previewUrl: null
          };

          let itunesId = null;
          const am = od?.linksByPlatform?.appleMusic;
          if (am?.entityUniqueId) {
            const amEnt = od.entitiesByUniqueId[am.entityUniqueId];
            if (amEnt && amEnt.apiProvider === 'itunes') itunesId = amEnt.id;
          }
          if (!itunesId && am?.url) {
            const match = am.url.match(/[?&]i=(\d+)/);
            if (match) itunesId = match[1];
          }

          const tasks = [];
          if (itunesId) {
            tasks.push(fetch(`https://itunes.apple.com/lookup?id=${itunesId}&entity=song&country=${COUNTRY}`)
              .then(r => r.json())
              .then(d => {
                if (d.results?.[0]) {
                  item.previewUrl = d.results[0].previewUrl;
                  item.art = (d.results[0].artworkUrl100 || item.art).replace('100x100bb', '600x600bb');
                }
              }).catch(() => { })
            );
          }
          if (ent.title) {
            tasks.push(fetchTinyfish(ent.title, ent.artistName).then(res => tf = res).catch(() => { }));
          }
          if (tasks.length) await Promise.allSettled(tasks);

        } else {
          const [odesliData, tfData] = await Promise.allSettled([
            fetchOdesli(item.appleUrl),
            fetchTinyfish(item.title, item.artist),
          ]);
          od = odesliData.status === 'fulfilled' ? odesliData.value : null;
          tf = tfData.status === 'fulfilled' ? tfData.value : {};
        }

        // Metadata
        const ent = od?.entitiesByUniqueId?.[od?.entityUniqueId] || {};
        document.getElementById('art').src = item.art || ent.thumbnailUrl;
        document.getElementById('ctitle').textContent = ent.title || item.title;
        document.getElementById('cartist').textContent = ent.artistName || item.artist;

        // Setup Audio Player
        const pWrap = document.getElementById('playerWrap');
        if (item.previewUrl) {
          pWrap.style.display = 'flex';
          audio.src = item.previewUrl;
          audio.load();
          document.getElementById('seekFill').style.width = '0%';
          document.getElementById('timeLabel').textContent = '0:00';
        } else {
          pWrap.style.display = 'none';
          audio.pause();
        }

        // Merge links: odesli first, tinyfish fills gaps
        const links = {};
        P.forEach(p => {
          let href = od?.linksByPlatform?.[p.id]?.url;
          if (!href && p.id === 'youtubeMusic') {
            const yt = od?.linksByPlatform?.youtube?.url;
            if (yt && yt.includes('watch')) href = yt.replace('www.youtube.com', 'music.youtube.com').replace('youtube.com', 'music.youtube.com');
          }
          if (href) links[p.id] = href;
        });

        // Tinyfish fallbacks
        if (!links.spotify && tf.spotify) links.spotify = tf.spotify;
        if (!links.youtubeMusic && tf.youtubeMusic) links.youtubeMusic = tf.youtubeMusic;
        if (!links.appleMusic && typeof data !== 'string') links.appleMusic = item.appleUrl; // always guaranteed if from search

        // Render rows
        let found = 0;
        P.forEach(p => {
          let href = links[p.id]; if (!href) return;

          // Clean URLs for better UX
          try {
            const u = new URL(href);
            if (p.id === 'appleMusic') {
              if (u.hostname === 'geo.music.apple.com') u.hostname = 'music.apple.com';
              for (const k of Array.from(u.searchParams.keys())) if (k !== 'i') u.searchParams.delete(k);
            } else if (p.id === 'spotify') {
              u.searchParams.delete('si'); u.searchParams.delete('context');
            }
            href = u.toString();
          } catch (e) { }

          found++;
          linksEl.appendChild(makeRow(p, href));
        });

        if (!found) throw new Error('No links found.');
        cardEl.style.display = 'block';

      } catch (e) {
        showErr('Could not fetch links. Try again.'); console.error(e);
      } finally {
        setLoad(false);
      }
    }

    // ── Odesli fetch ───────────────────────────────────────────────────────────
    async function fetchOdesli(url) {
      const r = await fetch(`${ODESLI}?url=${enc(url)}&userCountry=${COUNTRY}`);
      if (!r.ok) throw new Error(`odesli ${r.status}`);
      return r.json();
    }

    // Fire parallel searches for maximum accuracy on niche songs
    async function fetchTinyfish(title, artist) {
      const headers = { 'X-API-Key': TFKEY };
      const out = {};

      try {
        const [spRes, ytRes] = await Promise.allSettled([
          fetch(`${TFAPI}?query=${enc(title + ' ' + artist + ' spotify track')}`, { headers }).then(r => r.ok ? r.json() : null),
          fetch(`${TFAPI}?query=${enc(title + ' ' + artist + ' youtube music')}`, { headers }).then(r => r.ok ? r.json() : null)
        ]);

        if (spRes.status === 'fulfilled' && spRes.value?.results) {
          for (const r of spRes.value.results) {
            if (r.url.includes('open.spotify.com/track')) {
              out.spotify = r.url; break;
            }
          }
        }

        if (ytRes.status === 'fulfilled' && ytRes.value?.results) {
          for (const r of ytRes.value.results) {
            if (r.url.includes('music.youtube.com/watch')) {
              out.youtubeMusic = r.url; break;
            }
            if (r.url.includes('youtube.com/watch') && !r.url.includes('list=')) {
              out.youtubeMusic = r.url.replace('www.youtube.com', 'music.youtube.com'); break;
            }
          }
        }
      } catch (e) {
        console.error('TinyFish error:', e);
      }

      return out;
    }

    // ── Build a platform row ───────────────────────────────────────────────────
    function makeRow(p, href) {
      const row = document.createElement('div');
      row.className = 'prow';

      const a = document.createElement('a');
      a.className = 'plink'; a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';

      const icon = document.createElement('div');
      icon.className = 'picon';
      icon.style.background = p.bg;
      icon.innerHTML = `<svg viewBox="${p.viewBox || '0 0 24 24'}" fill="${p.fg}" xmlns="http://www.w3.org/2000/svg">${p.svg}</svg>`;

      const name = document.createElement('span');
      name.className = 'pname'; name.textContent = p.name;

      a.append(icon, name);

      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.title = 'Copy link';
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy`;

      btn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(href);
          btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Copied`;
          btn.classList.add('copied');
          setTimeout(() => { btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy`; btn.classList.remove('copied'); }, 1800);
        } catch (_) { }
      });

      row.append(a, btn);
      return row;
    }

    // ── Helpers ────────────────────────────────────────────────────────────────
    function setLoad(on) {
      if (on && typeof audio !== 'undefined') { try { audio.pause(); } catch (e) { } }
      loaderEl.style.display = on ? 'block' : 'none';
      if (on) { cardEl.style.display = 'none'; errEl.style.display = 'none'; }
    }
    function showErr(msg) { errEl.textContent = msg; errEl.style.display = 'block'; loaderEl.style.display = 'none'; }
    function enc(s) { return encodeURIComponent(s); }
    function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    // Easter Egg Placeholder Rotation
    const ph = ['Type a few lyrics…', 'Search a song…', 'Drop a link…'];
    let phIdx = 0;
    setInterval(() => {
      if (document.activeElement !== qEl && qEl.value === '') {
        qEl.classList.add('ph-fade');
        setTimeout(() => {
          phIdx = (phIdx + 1) % ph.length;
          qEl.placeholder = ph[phIdx];
          qEl.classList.remove('ph-fade');
        }, 500);
      }
    }, 3000);
  </script>
</body>
